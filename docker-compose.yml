services:
  postgres:
    image: postgres:16-alpine
    container_name: school-records-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sponte_app
      POSTGRES_PASSWORD: sponte_dev_password
      POSTGRES_DB: integracao_sponte
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponte_app -d integracao_sponte"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
